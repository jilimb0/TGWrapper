packages:
  - '.'
  - 'packages/*'
  - 'examples/*'

overrides:
  vite: 8.0.16
  'undici@^6': 6.28.1
  'undici@^7': 7.29.1
  'ws@^8': 8.21.0
  read-yaml-file: 2.1.0
  'js-yaml@^4': 4.3.2
  'markdown-it@^14': 14.3.2
  esbuild: 0.28.1
  'linkify-it@^5': 5.0.2
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^2': 2.1.7
  'brace-expansion@^5': 5.0.12
  sharp: 0.35.5
  source-map-js: 1.2.2
  'postcss@^8': 8.5.29

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@tgwrapper/core'
  - '@tgwrapper/adapter-redis'
  - '@tgwrapper/observability'
  - '@tgwrapper/starter-migration'
  - '@tgwrapper/starter-standard-bot'
  - '@tgwrapper/starter-support-bot'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  serverless: true
  sharp: true
  workerd: true
